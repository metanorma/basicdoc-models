name: rake

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:

jobs:
  rake:
    name: Test on LutaML ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Self-contained tool setup. Renders diagrams with lutaml-lml
      # (graphviz-backed); graphviz is preinstalled on GitHub-hosted runners,
      # installed defensively only when missing.
      - if: runner.os == 'Linux'
        run: command -v dot >/dev/null || { sudo apt-get update && sudo apt-get install -y graphviz; }
      - if: runner.os == 'macOS'
        run: command -v dot >/dev/null || brew install graphviz
      - if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command dot -ErrorAction SilentlyContinue)) { choco install -y graphviz }

      # workaround for https://github.com/actions/runner-images/issues/37
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec rake clean render

      - name: Verify PNG output
        run: bundle exec rake verify

      - name: LML/RNC parity
        run: bundle exec rake parity
